services:
  - type: web
    name: planificador
    runtime: python
    plan: free
    # La BD esta en Supabase eu-west-1 (Irlanda): el servicio web debe estar al
    # lado o cada consulta SQL cruza el Atlantico. La region NO se puede cambiar
    # en un servicio ya creado, hay que recrearlo.
    region: frankfurt
    branch: develop
    buildCommand: ./build.sh
    # UN SOLO worker: el plan free son 512 MB y cada worker es un Django entero.
    # Con 2 workers el contenedor se queda sin memoria y Render responde
    # "x-render-routing: no-server". La concurrencia se saca con hilos, que
    # comparten memoria y aqui basta porque se espera a la red, no a la CPU.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 8 --timeout 60 --max-requests 1000 --max-requests-jitter 100
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Solo el dominio propio. El hostname *.onrender.com del servicio se anade
      # solo desde RENDER_EXTERNAL_HOSTNAME (ver config/settings.py), asi que
      # esto sigue valiendo aunque se recree el servicio y cambie esa URL.
      - key: ALLOWED_HOSTS
        value: www.mpc1.es,mpc1.es
      - key: CSRF_TRUSTED_ORIGINS
        value: https://www.mpc1.es,https://mpc1.es
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Secretos: Render los pide al crear el Blueprint, no se guardan en el repo.
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
